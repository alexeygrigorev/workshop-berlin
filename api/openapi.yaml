  /v1/teams/{teamId}/restaurants:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Restaurants]
      operationId: listRestaurants
      security:
        - bearerAuth: [read]
        - cookieAuth: []
      summary: List the team's restaurants
      description: |
        **Member.** Sorted by name (case-insensitive). By default only active restaurants are returned; use
        `status=all` or `status=archived` for admin/history views. Optional `q` does a case-insensitive
        substring search over name, cuisine and address. Not paginated: teams are expected to have at
        most a few hundred restaurants.
      parameters:
        - name: status
          in: query
          required: false
          description: Which restaurants to include.
          schema:
            type: string
            enum: [active, archived, all]
            default: active
        - name: q
          in: query
          required: false
          description: Case-insensitive search over name, cuisine and address.
          schema:
            type: string
            maxLength: 120
          example: thai
      responses:
        '200':
          description: Restaurants.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Restaurant'
              example:
                items:
                  - id: 3f2a1b0c-9d8e-4f7a-a6b5-c4d3e2f1a0b9
                    team_id: 7d0f6a52-8a8e-4f43-b0a3-2b5f3e1d9c10
                    name: Pho Saigon
                    cuisine: Vietnamese
                    address: Reinhardtstraße 12, 10117 Berlin
                    website_url: null
                    map_url: https://www.google.com/maps/search/?api=1&query=Pho+Saigon+Reinhardtstra%C3%9Fe+12
                    notes: Fast at 12:00, slow after 12:30
                    archived_at: null
                    created_by: 5b1c3f0e-2a4d-4f7e-9c11-0d2b6c8a9e01
                    created_at: '2026-11-02T08:10:00Z'
                    updated_at: '2026-11-02T08:10:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Restaurants]
      operationId: createRestaurant
      security:
        - bearerAuth: [write]
        - cookieAuth: []
      summary: Add a restaurant
      description: |
        **Member.** Adds a restaurant to the team list. If today's poll is currently `open`, the restaurant is
        added to its candidates in the same transaction (existing ballots are unchanged). If the poll is
        `scheduled` it is also included; if it is `closed`, it appears from the next poll.

        Duplicate protection: rejected with `409 duplicate_restaurant` if an **active** restaurant has the same
        normalized name (trimmed, case- and whitespace-insensitive) and, when both have one, the same normalized
        address. The problem body includes `existing_restaurant_id`. If the duplicate is archived, unarchive it
        instead (`unarchiveRestaurant`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantCreate'
            example:
              name: Pho Saigon
              cuisine: Vietnamese
              address: Reinhardtstraße 12, 10117 Berlin
              website_url: null
              map_url: https://www.google.com/maps/search/?api=1&query=Pho+Saigon+Reinhardtstra%C3%9Fe+12
              notes: Fast at 12:00, slow after 12:30
      responses:
        '201':
          description: Restaurant created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
              examples:
                restaurant:
                  $ref: '#/components/examples/RestaurantExample'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`duplicate_restaurant` - an active restaurant with the same name (and address) exists.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://docs.wswe.dev/problems/duplicate-restaurant
                title: Restaurant already exists
                status: 409
                code: duplicate_restaurant
                detail: '"Pho Saigon" at Reinhardtstraße 12 is already on the list.'
                existing_restaurant_id: 3f2a1b0c-9d8e-4f7a-a6b5-c4d3e2f1a0b9
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/teams/{teamId}/restaurants/{restaurantId}:
