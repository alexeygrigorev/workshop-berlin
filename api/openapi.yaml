                status: open
                final: false
                ballot_count: 2
                member_count: 6
                leader_ids: [3f2a1b0c-9d8e-4f7a-a6b5-c4d3e2f1a0b9]
                winner_id: null
                no_winner: false
                tie_break: null
                items:
                  - restaurant_id: 3f2a1b0c-9d8e-4f7a-a6b5-c4d3e2f1a0b9
                    name: Pho Saigon
                    score: 5
                    first_count: 1
                    second_count: 1
                    third_count: 0
                    position: 1
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/teams/{teamId}/polls/{pollId}/finalize:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/PollId'
    post:
      tags: [Polls]
      operationId: finalizePoll
      security:
        - bearerAuth: [write]
        - cookieAuth: []
      summary: Finalize a poll whose closing time has passed
      description: |
        **Member.** Normally the server scheduler finalizes polls at `closes_at`; reads also finalize lazily.
        This operation lets any client force reconciliation (e.g. a CLI right after 11:30). It never closes a
        poll early: before `closes_at` it fails with `409 poll_not_closable`. **Idempotent**: repeated calls
        return the same winner, scores and tie-break, with `200`.
      responses:
        '200':
          description: The finalized poll.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poll'
              examples:
                closedPoll:
                  $ref: '#/components/examples/ClosedPollExample'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`poll_not_closable` - `closes_at` has not been reached yet.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://docs.wswe.dev/problems/poll-not-closable
                title: Poll is still running
                status: 409
                code: poll_not_closable
                detail: This poll closes at 2026-11-17T10:30:00Z.

  /v1/teams/{teamId}/polls/{pollId}/ballots:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/PollId'
    get:
      tags: [Ballots]
      operationId: listBallots
      security:
        - bearerAuth: [read]
        - cookieAuth: []
      summary: List named ballots for a poll
      description: |
        **Member.** Every member's current ballot with display name, ordered by `submitted_at`. Ballots are
        intentionally public within the team. For closed polls these are the ballots as submitted at close.
        Bounded by team size, so not paginated.
      responses:
        '200':
          description: Ballots.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ballot'
              example:
                items:
                  - poll_id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                    team_id: 7d0f6a52-8a8e-4f43-b0a3-2b5f3e1d9c10
                    user_id: 5b1c3f0e-2a4d-4f7e-9c11-0d2b6c8a9e01
                    display_name: anna
                    choices:
                      - 3f2a1b0c-9d8e-4f7a-a6b5-c4d3e2f1a0b9
                      - 8b7a6c5d-4e3f-4a2b-9c1d-0e9f8a7b6c5d
                    submitted_at: '2026-11-17T08:42:10Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/teams/{teamId}/polls/{pollId}/ballots/me:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/PollId'
    get:
      tags: [Ballots]
      operationId: getMyBallot
      security:
        - bearerAuth: [read]
        - cookieAuth: []
      summary: Get my ballot for a poll
      description: '**Member.** The caller''s saved ballot. `404 not_found` if the caller has not voted in this poll.'
      responses:
        '200':
          description: My ballot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ballot'
              examples:
                ballot:
                  $ref: '#/components/examples/BallotExample'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Ballots]
      operationId: submitBallot
      security:
        - bearerAuth: [write]
        - cookieAuth: []
      summary: Submit or replace my ballot
      description: |
        **Member.** Saves the caller's ranked choices, best first. **Replaces** any earlier ballot atomically
        (idempotent: sending the same choices twice leaves one ballot). Rules:
        - 1 to 3 restaurant IDs, all distinct (`422 validation_failed`).
        - Every ID must be a candidate of this poll (`422 invalid_candidate`); archived-but-still-candidate
          restaurants are valid.
        - Only while `opens_at <= server_now < closes_at`: before -> `409 poll_not_open`,
          at/after -> `409 poll_closed` (even if the scheduler has not run yet).

        Returns `201` when the caller had no ballot yet, `200` when one was replaced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BallotSubmit'
            example:
              choices:
                - 3f2a1b0c-9d8e-4f7a-a6b5-c4d3e2f1a0b9
                - 8b7a6c5d-4e3f-4a2b-9c1d-0e9f8a7b6c5d
                - c1d2e3f4-a5b6-4c7d-8e9f-0a1b2c3d4e5f
      responses:
        '200':
          description: Ballot replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ballot'
              examples:
                ballot:
                  $ref: '#/components/examples/BallotExample'
        '201':
          description: First ballot saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ballot'
              examples:
                ballot:
                  $ref: '#/components/examples/BallotExample'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PollNotAcceptingBallots'
        '422':
          description: |
            `validation_failed` (wrong count / duplicates / malformed IDs) or `invalid_candidate`
            (an ID is not a candidate of this poll).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                tooMany:
                  summary: Four choices
                  value:
                    type: https://docs.wswe.dev/problems/validation-failed
                    title: Validation failed
                    status: 422
                    code: validation_failed
                    detail: Pick 1 to 3 different restaurants.
                    errors:
                      - pointer: /choices
                        code: too_many_items
                        message: At most 3 choices are allowed.
                notCandidate:
                  summary: Not a candidate
                  value:
                    type: https://docs.wswe.dev/problems/invalid-candidate
                    title: Not a candidate
                    status: 422
                    code: invalid_candidate
                    detail: Restaurant d4e5f6a7-b8c9-4d0e-9f1a-2b3c4d5e6f7a is not a candidate in this poll.
                    errors:
                      - pointer: /choices/1
                        code: invalid_candidate
                        message: Not a candidate in this poll.
    delete:
      tags: [Ballots]
      operationId: deleteMyBallot
      security:
        - bearerAuth: [write]
        - cookieAuth: []
      summary: Withdraw my ballot
      description: |
        **Member.** Removes the caller's ballot while the poll is open (same time rules as `submitBallot`).
        Idempotent: `204` even if there was no ballot.
      responses:
        '204':
          description: Ballot withdrawn (or there was none).
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PollNotAcceptingBallots'

  /v1/teams/{teamId}/stats/restaurants:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Stats]
      operationId: getRestaurantStats
      security:
        - bearerAuth: [read]
        - cookieAuth: []
      summary: Restaurant win statistics
      description: |
        **Member.** Computed from finalized polls only. Powers the "Recently chosen" (sort by `last_won_on`)
        and "Popular with team" (sort by `wins_recent`, then `wins_total`) shortcuts and history win counts.
        Includes archived restaurants that have won before. `recent_window` is the number of most recent
        closed polls counted in `wins_recent` (default 30).
      parameters:
        - name: recent_window
          in: query
          required: false
          description: Number of most recent closed polls used for `wins_recent`.
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        '200':
          description: Per-restaurant stats, sorted by `wins_total` descending, then name.
          content:
            application/json:
              schema:
                type: object
                required: [recent_window, closed_poll_count, items]
                properties:
                  recent_window:
                    type: integer
                  closed_poll_count:
                    type: integer
                    description: Total closed polls for the team (including no-winner days).
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RestaurantStats'
              example:
                recent_window: 30
                closed_poll_count: 11
                items:
                  - restaurant_id: 3f2a1b0c-9d8e-4f7a-a6b5-c4d3e2f1a0b9
                    name: Pho Saigon
                    archived: false
                    wins_total: 4
                    wins_recent: 4
                    last_won_on: '2026-11-16'
                    total_points: 61
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/teams/{teamId}/events:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Events]
      operationId: streamTeamEvents
      security:
        - bearerAuth: [read]
        - cookieAuth: []
      summary: Subscribe to live team events (Server-Sent Events)
      description: |
        **Member.** A long-lived `text/event-stream` (SSE) of changes in one team. Each SSE message has
        `id` (monotonic per team), `event` (the event type) and `data` (a JSON `TeamEvent`).

        Event types:
        - `poll.opened`, `poll.closed` (finalized; carries winner), `poll.updated` (candidates changed)
        - `ballot.submitted`, `ballot.withdrawn` (carry `ballot_count`)
        - `restaurant.created`, `restaurant.updated`, `restaurant.archived`, `restaurant.unarchived`
        - `member.joined`, `member.left`, `member.removed`, `member.role_changed`
        - `team.updated` (name/timezone/schedule), `invite.changed` (no token in payload)
        - `resync` - the server cannot replay missed events; re-fetch everything.

        Events are invalidation hints; re-fetch the affected resource (e.g. `getCurrentPoll`) for canonical
        state. The server sends a `: keep-alive` comment every 25s. On reconnect send `Last-Event-ID` to replay
        missed events (kept ~10 minutes); otherwise you receive `resync`. If the caller loses membership the
        stream ends. Browsers using `EventSource` authenticate with the session cookie; other clients use
        the bearer header. Clients that cannot hold a stream may poll `getCurrentPoll` instead.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: ID of the last event received, to resume after a reconnect.
          schema:
            type: string
          example: '48213'
      responses:
        '200':
          description: Event stream (never ends normally).
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames. Each `data:` line is a JSON-encoded `TeamEvent`.
                contentMediaType: text/event-stream
              example: |
                id: 48214
                event: ballot.submitted
                data: {"id":"48214","type":"ballot.submitted","team_id":"7d0f6a52-8a8e-4f43-b0a3-2b5f3e1d9c10","occurred_at":"2026-11-17T09:41:12Z","poll_id":"1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d","data":{"user_id":"9e4d2c1b-3a5f-4e6d-8c7b-6a5f4e3d2c1b","ballot_count":3}}

                : keep-alive

                id: 48215
                event: poll.closed
                data: {"id":"48215","type":"poll.closed","team_id":"7d0f6a52-8a8e-4f43-b0a3-2b5f3e1d9c10","occurred_at":"2026-11-17T10:30:00Z","poll_id":"1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d","data":{"winner_id":"3f2a1b0c-9d8e-4f7a-a6b5-c4d3e2f1a0b9","no_winner":false,"tie_break":null}}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <token>` where the token is either a session token (from `signUp`/`signIn`,
        valid for 30 days, renewed on every use - sliding expiry) or a personal API token (`wswe_pat_...`, from `createApiToken`).
        Preferred for CLIs, agents and server-side callers.
    cookieAuth:
      type: apiKey
      in: cookie
      name: wswe_session
      description: |
        `HttpOnly; Secure; SameSite=Lax` session cookie set by `signUp`/`signIn`, for browsers (including
        `EventSource`). Unsafe methods authenticated by cookie require a same-origin `Origin` header.

  parameters:
    TeamId:
      name: teamId
      in: path
      required: true
      description: Team ID.
      schema:
        type: string
        format: uuid
      example: 7d0f6a52-8a8e-4f43-b0a3-2b5f3e1d9c10
    PollId:
      name: pollId
      in: path
      required: true
      description: Poll ID.
      schema:
        type: string
        format: uuid
      example: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
    RestaurantId:
      name: restaurantId
      in: path
      required: true
      description: Restaurant ID.
      schema:
        type: string
        format: uuid
      example: 3f2a1b0c-9d8e-4f7a-a6b5-c4d3e2f1a0b9
    UserId:
      name: userId
      in: path
      required: true
      description: User ID of a team member.
      schema:
        type: string
        format: uuid
      example: 9e4d2c1b-3a5f-4e6d-8c7b-6a5f4e3d2c1b
    TokenId:
      name: tokenId
      in: path
      required: true
      description: Personal API token ID (not the secret).
      schema:
        type: string
        format: uuid
      example: 0c6a3e1f-5b7d-4c2a-8e9f-1a2b3c4d5e6f
    InviteToken:
      name: inviteToken
      in: path
      required: true
      description: The secret token from an invite link (`/join/{inviteToken}`).
      schema:
        type: string
        minLength: 16
        maxLength: 128
      example: q8Zr2mXc4VbN6tLp0sKd
    PollDate:
      name: pollDate
      in: path
      required: true
      description: Team-local calendar date of the poll.
      schema:
        type: string
        format: date
      example: '2026-11-16'
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `next_cursor`.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional client-generated unique key (e.g. a UUID). Retrying the same request with the same key within
        24h returns the original response instead of creating a duplicate. Reusing a key with a different body
        fails with `409 idempotency_key_reused`.
      schema:
        type: string
        maxLength: 255
      example: 6f1c2b8e-4a1d-4d0b-9e3c-7a2f5b8c9d01
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: ETag from a previous `GET`. If the resource changed since, the update fails with `412 precondition_failed`.
      schema:
        type: string
      example: '"r-17"'

  headers:
    ETag:
      description: Version tag of the resource, for `If-Match`.
      schema:
        type: string
      example: '"r-17"'
    Location:
      description: URL of the created resource.
      schema:
        type: string
        format: uri-reference
    SessionCookie:
      description: '`wswe_session=<token>; HttpOnly; Secure; SameSite=Lax; Path=/` (browsers).'
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer

  responses:
    Unauthenticated:
      description: '`unauthenticated` - missing, invalid, expired or revoked credentials.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.wswe.dev/problems/unauthenticated
            title: Not signed in
            status: 401
            code: unauthenticated
            detail: Sign in or provide a valid bearer token.
    Forbidden:
      description: |
        `not_a_member` - the caller is not a member of this team; `admins_only` - the operation requires the
        admin role; `insufficient_scope` - the API token lacks the required scope (`read`/`write`) or the
        operation requires a session rather than an API token; `forbidden` - other permission failure (e.g.
        editing a restaurant you did not create).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notAMember:
              summary: Not a member
              value:
                type: https://docs.wswe.dev/problems/not-a-member
                title: Not a member of this team
                status: 403
                code: not_a_member
            adminsOnly:
              summary: Admins only
              value:
                type: https://docs.wswe.dev/problems/admins-only
                title: Admins only
                status: 403
                code: admins_only
                detail: Only team admins can change team settings.
            insufficientScope:
              summary: API token lacks scope
              value:
                type: https://docs.wswe.dev/problems/insufficient-scope
                title: Insufficient token scope
                status: 403
                code: insufficient_scope
                detail: This operation requires the `write` scope.
    NotFound:
      description: '`not_found` - the resource does not exist (within this team).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.wswe.dev/problems/not-found
            title: Not found
            status: 404
            code: not_found
            detail: Poll 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d does not exist in this team.
    InviteInvalid:
      description: '`invite_invalid` - the invite token is unknown, revoked or was regenerated.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.wswe.dev/problems/invite-invalid
            title: Invalid invite link
            status: 404
            code: invite_invalid
            detail: This invite link is invalid or was revoked. Ask your team admin for a new one.
    Conflict:
      description: '`duplicate_restaurant` or another state conflict; see `code`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.wswe.dev/problems/duplicate-restaurant
            title: Restaurant already exists
            status: 409
            code: duplicate_restaurant
            existing_restaurant_id: 3f2a1b0c-9d8e-4f7a-a6b5-c4d3e2f1a0b9
    LastAdmin:
      description: '`last_admin` - the team must keep at least one admin.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.wswe.dev/problems/last-admin
            title: Team needs an admin
            status: 409
            code: last_admin
            detail: Promote another member to admin first.
    PollNotAcceptingBallots:
      description: '`poll_closed` (at/after `closes_at`) or `poll_not_open` (before `opens_at`).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            closed:
              summary: Poll closed
              value:
                type: https://docs.wswe.dev/problems/poll-closed
                title: This poll is closed
                status: 409
                code: poll_closed
                detail: Voting closed at 11:30 Europe/Berlin (2026-11-17T10:30:00Z).
            notOpen:
              summary: Poll not open yet
              value:
                type: https://docs.wswe.dev/problems/poll-not-open
                title: This poll is not open yet
                status: 409
                code: poll_not_open
                detail: Voting opens at 08:00 Europe/Berlin (2026-11-17T07:00:00Z).
    PreconditionFailed:
      description: '`precondition_failed` - `If-Match` did not match the current ETag; re-fetch and retry.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.wswe.dev/problems/precondition-failed
            title: Resource changed
            status: 412
            code: precondition_failed
    ValidationFailed:
      description: '`validation_failed` - the request body or parameters are invalid; see `errors`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.wswe.dev/problems/validation-failed
            title: Validation failed
            status: 422
            code: validation_failed
            errors:
              - pointer: /password
                code: too_short
                message: Password should be at least 6 characters.
    RateLimited:
      description: '`rate_limited` - too many requests; retry after `Retry-After` seconds.'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.wswe.dev/problems/rate-limited
            title: Too many requests
            status: 429
            code: rate_limited

  schemas:
    Uuid:
      type: string
      format: uuid
      examples: [7d0f6a52-8a8e-4f43-b0a3-2b5f3e1d9c10]
    Timestamp:
      type: string
      format: date-time
      description: UTC instant (RFC 3339).
      examples: ['2026-11-17T10:30:00Z']
    LocalTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: Team-local wall-clock time `HH:MM`.
      examples: ['08:00']
    TimeZone:
      type: string
      description: IANA timezone name (never a fixed offset).
      minLength: 1
      maxLength: 64
      examples: [Europe/Berlin]
    Role:
      type: string
      enum: [admin, member]
    PollStatus:
      type: string
      enum: [scheduled, open, closed]
      description: |
        `scheduled` - exists, not open yet; `open` - accepting ballots (`opens_at <= now < closes_at`);
        `closed` - finalized and immutable.
    TieBreak:
      type: [string, 'null']
      enum: [first_place_votes, second_place_votes, random_draw, null]
      description: |
        How a tie on points was resolved at finalization; `null` if there was no tie for first place or the
        poll is not closed. `first_place_votes` - most 1st-place votes; `second_place_votes` - then most
        2nd-place votes; `random_draw` - complete tie, decided by a reproducible seeded draw.

    Problem:
      type: object
      description: RFC 9457 problem details, extended with a stable machine-readable `code`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the problem type (documentation link).
        title:
          type: string
          description: Short human-readable summary. Do not parse.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation for this occurrence; safe to show to end users.
        instance:
          type: string
          description: Request path or ID of this occurrence.
        code:
          type: string
          description: Stable error code for programmatic handling.
          enum:
            - unauthenticated
            - invalid_credentials
            - email_taken
            - validation_failed
            - not_found
            - not_a_member
            - admins_only
            - forbidden
            - insufficient_scope
            - invite_invalid
            - last_admin
            - duplicate_restaurant
            - invalid_candidate
            - poll_not_open
            - poll_closed
            - poll_not_closable
            - precondition_failed
            - idempotency_key_reused
            - rate_limited
            - unavailable
            - internal_error
        errors:
          type: array
          description: Field-level details (for `validation_failed` / `invalid_candidate`).
          items:
            type: object
            required: [pointer, code, message]
            properties:
              pointer:
                type: string
                description: JSON Pointer (RFC 6901) into the request body, or `?name` for a query parameter.
              code:
                type: string
                description: e.g. `required`, `too_short`, `too_long`, `too_many_items`, `duplicate_items`, `invalid_format`, `invalid_timezone`, `invalid_candidate`.
              message:
                type: string
        existing_restaurant_id:
          $ref: '#/components/schemas/Uuid'
          description: Set for `duplicate_restaurant`.
        request_id:
          type: string
          description: Correlation ID; include it when reporting issues.

    Health:
      type: object
      required: [status, version, server_time]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
        server_time:
          $ref: '#/components/schemas/Timestamp'

    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 6
          maxLength: 200
          writeOnly: true

    User:
      type: object
      required: [id, email, display_name, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          format: email
        display_name:
          type: string
          description: Shown to teammates. Defaults to the local part of the email.
        created_at:
          $ref: '#/components/schemas/Timestamp'

    UserUpdate:
      type: object
      minProperties: 1
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 60

    Session:
      type: object
      required: [access_token, token_type, expires_at, user]
      properties:
        access_token:
          type: string
          description: "Opaque session token; send as `Authorization: Bearer <access_token>`."
        token_type:
          type: string
          enum: [Bearer]
        expires_at:
          $ref: '#/components/schemas/Timestamp'
          description: |
            Session expiry as of this response (30 days from now). Sliding: each authenticated request
            extends it to 30 days from that request; there is no refresh endpoint.
        user:
          $ref: '#/components/schemas/User'

    ApiTokenCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Label to recognise the token later (e.g. "lunch-cli on laptop", "Slack agent").
        scopes:
          $ref: '#/components/schemas/TokenScopes'
        expires_at:
          description: Optional expiry; `null` or omitted means no expiry.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    TokenScopes:
      type: array
      description: |
        `read` - call operations that only read data (`GET`, event stream). `write` - call operations that
        change state. Defaults to both when omitted on create.
      minItems: 1
      uniqueItems: true
      items:
        type: string
        enum: [read, write]
      default: [read, write]
      examples: [[read, write]]

    ApiToken:
      type: object
      required: [id, name, scopes, token_prefix, created_at, expires_at, last_used_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        scopes:
          $ref: '#/components/schemas/TokenScopes'
        token_prefix:
          type: string
          description: First characters of the secret, to help identify it.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        last_used_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    ApiTokenWithSecret:
      allOf:
        - $ref: '#/components/schemas/ApiToken'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The secret bearer token. Returned only once.

    TeamRef:
      type: object
      required: [id, name, timezone]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        timezone:
          $ref: '#/components/schemas/TimeZone'

    MyTeam:
      type: object
      required: [role, joined_at, team]
      properties:
        role:
          $ref: '#/components/schemas/Role'
        joined_at:
          $ref: '#/components/schemas/Timestamp'
        team:
          $ref: '#/components/schemas/TeamRef'

    Schedule:
      type: object
      required: [open_time, close_time, weekdays]
      properties:
        open_time:
          $ref: '#/components/schemas/LocalTime'
        close_time:
          $ref: '#/components/schemas/LocalTime'
        weekdays:
          type: array
          readOnly: true
          description: ISO weekdays with polls (1 = Monday). Fixed to Monday-Friday in the MVP.
          items:
            type: integer
            minimum: 1
            maximum: 7

    Team:
      type: object
      required: [id, name, timezone, office, schedule, my_role, member_count, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        timezone:
          $ref: '#/components/schemas/TimeZone'
        office:
          type: [string, 'null']
          description: Optional office location text.
        schedule:
          $ref: '#/components/schemas/Schedule'
        my_role:
          $ref: '#/components/schemas/Role'
        member_count:
          type: integer
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    TeamCreate:
      type: object
      required: [name, timezone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        timezone:
          $ref: '#/components/schemas/TimeZone'
        office:
          type: [string, 'null']
          maxLength: 120
        open_time:
          $ref: '#/components/schemas/LocalTime'
          default: '08:00'
        close_time:
          $ref: '#/components/schemas/LocalTime'
          default: '11:30'

    TeamUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        timezone:
          $ref: '#/components/schemas/TimeZone'
        office:
          type: [string, 'null']
          maxLength: 120
        open_time:
          $ref: '#/components/schemas/LocalTime'
        close_time:
          $ref: '#/components/schemas/LocalTime'

    Member:
      type: object
      required: [user_id, display_name, role, joined_at]
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        joined_at:
          $ref: '#/components/schemas/Timestamp'

    MemberUpdate:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'

    Invite:
      type: object
      required: [active, token, url, updated_at]
      properties:
        active:
          type: boolean
        token:
          type: [string, 'null']
          description: Secret invite token; `null` when revoked.
        url:
          type: [string, 'null']
          format: uri
          description: Shareable web URL (`<app origin>/join/<token>`); `null` when revoked.
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    InvitePreview:
      type: object
      required: [team_id, team_name, member_count, already_member]
      properties:
        team_id:
          $ref: '#/components/schemas/Uuid'
        team_name:
          type: string
        member_count:
          type: integer
        already_member:
          type: boolean

    JoinResult:
      type: object
      required: [joined, role, team]
      properties:
        joined:
          type: boolean
          description: '`true` if this call created the membership, `false` if the caller was already a member.'
        role:
          $ref: '#/components/schemas/Role'
        team:
          $ref: '#/components/schemas/TeamRef'

    Restaurant:
      type: object
      required: [id, team_id, name, cuisine, address, website_url, map_url, notes, archived_at, created_by, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        team_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        cuisine:
          type: [string, 'null']
        address:
          type: [string, 'null']
        website_url:
          type: [string, 'null']
          format: uri
        map_url:
          type: [string, 'null']
          format: uri
        notes:
          type: [string, 'null']
        archived_at:
          description: When archived; `null` if active.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_by:
          description: User who added it; `null` if that user's account was deleted (or for dev seed data).
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    RestaurantCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        cuisine:
          type: [string, 'null']
          maxLength: 80
        address:
          type: [string, 'null']
          maxLength: 200
        website_url:
          type: [string, 'null']
          format: uri
          maxLength: 500
          description: Must be http(s).
        map_url:
          type: [string, 'null']
          format: uri
          maxLength: 500
          description: Must be http(s).
        notes:
          type: [string, 'null']
          maxLength: 500

    RestaurantUpdate:
      type: object
      minProperties: 1
      description: Partial update; same field rules as `RestaurantCreate`. Archive state is changed via `archiveRestaurant` / `unarchiveRestaurant`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        cuisine:
          type: [string, 'null']
          maxLength: 80
        address:
          type: [string, 'null']
          maxLength: 200
        website_url:
          type: [string, 'null']
          format: uri
          maxLength: 500
        map_url:
          type: [string, 'null']
          format: uri
          maxLength: 500
        notes:
          type: [string, 'null']
          maxLength: 500

    Candidate:
      type: object
      description: A restaurant eligible in a poll. The ID is the snapshot; the name is live until the poll closes.
      required: [id, name, archived]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          description: Live current name for scheduled/open polls; frozen at close for closed polls.
        archived:
          type: boolean
          description: Restaurant has since been archived (still a valid candidate in this poll).

    Standing:
      type: object
      required: [restaurant_id, name, score, first_count, second_count, third_count, position]
      properties:
        restaurant_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        score:
          type: integer
          description: '`3*first_count + 2*second_count + third_count`.'
        first_count:
          type: integer
        second_count:
          type: integer
        third_count:
          type: integer
        position:
          type: integer
          minimum: 1
          description: 1-based display order (score, 1st votes, 2nd votes, name). For closed polls position 1 is the winner.

    Standings:
      type: object
      required: [poll_id, status, final, ballot_count, member_count, leader_ids, winner_id, no_winner, tie_break, items]
      properties:
        poll_id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/PollStatus'
        final:
          type: boolean
          description: '`true` once the poll is closed and these are the final scores.'
        ballot_count:
          type: integer
        member_count:
          type: integer
          description: Current team size (participation denominator).
        leader_ids:
          type: array
          description: Candidates currently tied at the top score while open (may be several; empty if no ballots). Not a winner.
          items:
            $ref: '#/components/schemas/Uuid'
        winner_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        no_winner:
          type: boolean
        tie_break:
          $ref: '#/components/schemas/TieBreak'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Standing'

    Poll:
      type: object
      description: Poll summary (used in lists/history and as the base of `PollDetail`).
      required: [id, team_id, poll_date, timezone, opens_at, closes_at, status, candidates, winner_id, winner, no_winner, ballot_count, final_scores, tie_break, finalized_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        team_id:
          $ref: '#/components/schemas/Uuid'
        poll_date:
          type: string
          format: date
          description: Team-local date of the poll.
        timezone:
          $ref: '#/components/schemas/TimeZone'
        opens_at:
          $ref: '#/components/schemas/Timestamp'
        closes_at:
          $ref: '#/components/schemas/Timestamp'
        status:
          $ref: '#/components/schemas/PollStatus'
        candidates:
          type: array
          description: Candidate snapshot (ID + name), alphabetical.
          items:
            $ref: '#/components/schemas/Candidate'
        winner_id:
          description: Winning restaurant; `null` until closed or when `no_winner`.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        winner:
          description: Winner details for convenience (includes website/map links).
          oneOf:
            - $ref: '#/components/schemas/Restaurant'
            - type: 'null'
        no_winner:
          type: boolean
          description: '`true` when the poll closed with zero ballots.'
        ballot_count:
          type: integer
        final_scores:
          description: Final standings, set once closed; `null` before.
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/Standing'
            - type: 'null'
        tie_break:
          $ref: '#/components/schemas/TieBreak'
        finalized_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    PollDetail:
      description: Poll plus everything the voting screen needs.
      allOf:
        - $ref: '#/components/schemas/Poll'
        - type: object
          required: [standings, ballots, my_ballot, member_count, server_time]
          properties:
            standings:
              type: array
              description: Live standings while open; equal to `final_scores` once closed; empty-score rows when scheduled.
              items:
                $ref: '#/components/schemas/Standing'
            ballots:
              type: array
              description: Named ballots ordered by `submitted_at`.
              items:
                $ref: '#/components/schemas/Ballot'
            my_ballot:
              description: The caller's ballot, or `null`.
              oneOf:
                - $ref: '#/components/schemas/Ballot'
                - type: 'null'
            member_count:
              type: integer
            server_time:
              $ref: '#/components/schemas/Timestamp'

    PollPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Poll'
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` to get the next page; `null` when there are no more.

    Ballot:
      type: object
      required: [poll_id, team_id, user_id, display_name, choices, submitted_at]
      properties:
        poll_id:
          $ref: '#/components/schemas/Uuid'
        team_id:
          $ref: '#/components/schemas/Uuid'
        user_id:
          $ref: '#/components/schemas/Uuid'
        display_name:
          type: string
        choices:
          type: array
          description: Ranked restaurant IDs, best first (3/2/1 points).
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
        submitted_at:
          $ref: '#/components/schemas/Timestamp'

    BallotSubmit:
      type: object
      required: [choices]
      properties:
        choices:
          type: array
          description: 1-3 distinct candidate restaurant IDs, best first.
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'

    RestaurantStats:
      type: object
      required: [restaurant_id, name, archived, wins_total, wins_recent, last_won_on, total_points]
      properties:
        restaurant_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        archived:
          type: boolean
        wins_total:
          type: integer
        wins_recent:
          type: integer
          description: Wins within the last `recent_window` closed polls.
        last_won_on:
          type: [string, 'null']
          format: date
        total_points:
          type: integer
          description: Sum of final scores across all closed polls.

    TeamEvent:
      type: object
      description: Payload of one SSE message (`data:` line). Treat as a hint and re-fetch for canonical state.
      required: [id, type, team_id, occurred_at, data]
      properties:
        id:
          type: string
          description: Monotonic per team; same as the SSE `id`.
        type:
          type: string
          enum:
            - poll.opened
            - poll.updated
            - poll.closed
            - ballot.submitted
            - ballot.withdrawn
            - restaurant.created
            - restaurant.updated
            - restaurant.archived
            - restaurant.unarchived
            - member.joined
            - member.left
            - member.removed
            - member.role_changed
            - team.updated
            - invite.changed
            - resync
        team_id:
          $ref: '#/components/schemas/Uuid'
        poll_id:
          description: Set for `poll.*` and `ballot.*` events.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        data:
          type: object
          description: |
            Small type-specific payload, e.g. `{user_id, ballot_count}` for `ballot.*`,
            `{restaurant_id}` for `restaurant.*`, `{user_id, role}` for `member.*`,
            `{winner_id, no_winner, tie_break}` for `poll.closed`. Never contains secrets.
          additionalProperties: true

