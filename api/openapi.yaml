  /v1/teams/{teamId}/polls/current:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Polls]
      operationId: getCurrentPoll
      security:
        - bearerAuth: [read]
        - cookieAuth: []
      summary: Get today's poll (or the next scheduled one), with candidates, ballots and live standings
      description: |
        **Member.** The primary dashboard call. Returns the poll for today's team-local date if today is a poll
        day; otherwise (weekend, or the team's poll days are over) the next scheduled poll. The poll is
        created on first access if the scheduler has not created it yet, so this always returns a poll.

        Includes `candidates`, named `ballots`, live (or final) `standings`, and the caller's `my_ballot`.
        The response status reflects server time at the moment of the request; if `closes_at` has passed
        the poll is finalized before responding.
      responses:
