              examples:
                closedPollDetail:
                  $ref: '#/components/examples/ClosedPollDetailExample'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/teams/{teamId}/polls/{pollId}/standings:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/PollId'
    get:
      tags: [Polls]
      operationId: getPollStandings
      security:
        - bearerAuth: [read]
        - cookieAuth: []
      summary: Get computed standings for a poll
      description: |
        **Member.** Server-computed scores (3/2/1) with first/second/third counts for every candidate,
        including zero-vote candidates. While open these are **live** standings sorted for display (score,
        1st-place votes, 2nd-place votes, then name) and `leader` is *not* a winner. When closed they are
