openapi: 3.1.0
info:
  title: Where Should We Eat? API
  version: 1.0.0
  summary: Daily team lunch voting - teams, restaurants, ranked top-3 ballots, live standings and history.
  description: |
    HTTP API for the "Where Should We Eat?" lunch-voting app. It is the single source of truth for the
    web frontend, a CLI, and AI agents: every action available in the UI is available here, and nothing
    the UI does is UI-only.

    ## Concepts
    - A **team** has members (roles `admin` / `member`), a shared **restaurant** list, an IANA timezone
      and a daily schedule (default 08:00-11:30 team-local, Monday-Friday).
    - Every poll day the team gets exactly one **poll**. Its lifecycle is `scheduled` -> `open` -> `closed`,
      driven only by server time against `opens_at` / `closes_at` (UTC instants computed from the team's
      local schedule; DST-safe). Clients never decide status.
    - When a poll is created, all active restaurants are snapshotted as **candidates**. Restaurants added
      while the poll is open are added to its candidates; archiving a restaurant never removes it from an
      already-created poll.
    - A **ballot** ranks 1-3 distinct candidates. Points: 1st = 3, 2nd = 2, 3rd = 1 (positional/Borda-style,
      *not* instant-runoff). Ballots are visible, with voter names, to all team members.
    - At `closes_at` the poll is **finalized**: highest score wins; ties are broken by most 1st-place votes,
      then most 2nd-place votes, then a seeded deterministic random draw (the seed is never exposed).
      Zero ballots -> `no_winner: true`. Finalization is idempotent.

    ## Conventions
    - All paths are prefixed with `/v1`. Team-scoped resources live under `/v1/teams/{teamId}`.
    - IDs are UUIDs. Timestamps are RFC 3339 / ISO-8601 UTC instants (`2026-11-17T10:30:00Z`).
      `poll_date` is a calendar date (`YYYY-MM-DD`) in the team's timezone; polls also carry `timezone`.
      Local schedule times (`open_time`, `close_time`) are `HH:MM` in team-local time.
    - JSON field names are `snake_case`. Optional fields are present with `null` rather than omitted.
    - Lists are returned as `{ "items": [...] }`. Lists that grow without bound (polls/history) are
      cursor-paginated: pass `limit` and the opaque `cursor` from the previous response's `next_cursor`.
    - Errors are always `application/problem+json` (RFC 9457) with a stable machine-readable `code`.
      Branch on `code`, never on `title`/`detail` text. See the `Problem` schema for the full list.
    - Retries: `PUT` and `DELETE` are idempotent. `POST` create operations accept an optional
      `Idempotency-Key` header (any unique string, kept 24h) so a retried request returns the original
      result instead of creating a duplicate. Joining via invite and finalizing a poll are idempotent by design.
    - Optimistic concurrency: `GET` on teams and restaurants returns an `ETag`; send it as `If-Match` on
      `PATCH` to avoid lost updates (`412 precondition_failed` on mismatch). `If-Match` is optional.

    ## Authentication
    Two credential types, both sent as `Authorization: Bearer <token>`:
    - **Session tokens** from `signUp` / `signIn` (email + password, as the current app does). Browsers
      may instead rely on the `HttpOnly` session cookie set by the same calls (`cookieAuth`); cookie-
      authenticated unsafe requests must send an `Origin` header matching the app (CSRF protection).
    - **Personal API tokens** (`wswe_pat_...`) for CLIs and AI agents, created via `createApiToken`. They act
      as the user who created them, with the same team permissions, and can be revoked at any time.

    **Session expiry:** sessions last 30 days and are *sliding* - every authenticated request renews the
    expiry to 30 days from that request. There is no separate refresh endpoint; once a session expires
    (30 days without use) the client gets `401 unauthenticated` and signs in again. `expires_at` in the
    `signUp` / `signIn` response is the expiry as of sign-in.

    **Token scopes:** personal API tokens carry one or both scopes `read` and `write` (no per-team
    restriction). Each operation declares the scope it needs in its `security` requirement
    (`bearerAuth: [read]` or `bearerAuth: [write]`): reads (`GET`, including the event stream) need `read`;
    everything that changes state needs `write`. Session tokens and the session cookie have both scopes.
    Managing API tokens and signing out require a session, not an API token. A token lacking the required
    scope gets `403 insufficient_scope`. Scopes only narrow what a token can do; team role checks
    (member/admin) still apply.

    **CORS:** the server allows cross-origin browser requests only from a configurable allowlist of origins
    (the web app's origin by default). Non-browser clients (CLI, agents) are unaffected by CORS. Third-party
    browser clients should use bearer tokens, so no cookies or `credentials: include` are needed.

    Magic-link email and Google OAuth sign-in (specs.md section 2) are planned; they will be additional ways to
    obtain the same session token and will not change any other operation.

    ## Authorization
    Each operation states who may call it:
    - **Public** - no credentials.
    - **Authenticated** - any signed-in user.
    - **Member** - a member of `{teamId}`. Non-members get `403 not_a_member` (same for unknown teams
      the caller has no access to, so team existence is not leaked beyond that).
    - **Admin** - an admin of `{teamId}`; members get `403 admins_only`.

    ## Live updates
    `GET /v1/teams/{teamId}/events` is a Server-Sent Events stream of change notifications for one
    team (see `streamTeamEvents`). Events are hints: on any event, or after reconnecting, re-fetch the
    affected resource for canonical state.
  contact:
    name: Where Should We Eat? maintainers
servers:
  - url: https://api.example.com
    description: Production (placeholder - replace with the real deployment URL)
  - url: http://localhost:8787
    description: Local development server
tags:
  - name: Meta
    description: Service health and server time.
  - name: Auth
    description: Sign-up, sign-in and sign-out with email + password. Returns a session token.
  - name: Me
    description: The signed-in user and their teams.
  - name: API tokens
    description: Long-lived personal API tokens for CLIs and AI agents.
  - name: Teams
    description: Teams, team settings and schedule.
  - name: Members
    description: Team membership, roles, removing members and leaving a team.
  - name: Invites
    description: Shareable invite links (token based) to join a team.
  - name: Restaurants
    description: The team's persistent restaurant list. Soft-delete only (archive / unarchive).
  - name: Polls
    description: Daily polls, live standings, finalization and history.
  - name: Ballots
    description: Ranked top-3 ballots. One current ballot per member per poll; re-submitting replaces it.
  - name: Stats
    description: Aggregates computed from finalized history.
  - name: Events
    description: Realtime change notifications (Server-Sent Events).

security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /v1/health:
    get:
      tags: [Meta]
      operationId: getHealth
      summary: Health check and server time
      description: |
        **Public.** Returns service status and the authoritative server clock. Clients showing a countdown
        to `closes_at` can use `server_time` to correct for local clock skew.
      security: []
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                version: 1.0.0
                server_time: '2026-11-17T09:14:03Z'
        '503':
          description: Service (or its database) is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://docs.wswe.dev/problems/unavailable
                title: Service unavailable
                status: 503
                code: unavailable
                detail: Database is not reachable.
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/auth/sign-up:
    post:
      tags: [Auth]
      operationId: signUp
      summary: Create an account and start a session
      description: |
        **Public.** Creates a user with email + password and signs them in. The email is trimmed and
        lower-cased. Password must be at least 6 characters. Also sets the `wswe_session` cookie for browsers.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
            example:
              email: anna@company.com
              password: correct-horse
      responses:
        '201':
          description: Account created; session started.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                session:
                  $ref: '#/components/examples/SessionExample'
        '409':
          description: '`email_taken` - an account with this email already exists.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://docs.wswe.dev/problems/email-taken
                title: Email already registered
                status: 409
                code: email_taken
                detail: An account with anna@company.com already exists. Sign in instead.
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/auth/sign-in:
    post:
      tags: [Auth]
      operationId: signIn
      summary: Sign in with email and password
      description: |
        **Public.** Exchanges email + password for a session token (also set as the `wswe_session` cookie).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
            example:
              email: anna@company.com
              password: correct-horse
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                session:
                  $ref: '#/components/examples/SessionExample'
        '401':
          description: '`invalid_credentials` - unknown email or wrong password (deliberately indistinguishable).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://docs.wswe.dev/problems/invalid-credentials
                title: Invalid login credentials
                status: 401
                code: invalid_credentials
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/auth/sign-out:
    post:
      tags: [Auth]
      operationId: signOut
      summary: End the current session
      description: |
        **Authenticated (session).** Revokes the session token used for this request and clears the cookie.
        Idempotent. Calling it with a personal API token returns `204` without revoking the token
        (use `revokeApiToken` for that).
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/me:
    get:
      tags: [Me]
      operationId: getCurrentUser
      security:
        - bearerAuth: [read]
        - cookieAuth: []
      summary: Get the signed-in user
      description: |
        **Authenticated.** Returns the user behind the credentials. Use this to check whether a stored
        token/cookie is still valid (`401 unauthenticated` if not).
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                user:
                  $ref: '#/components/examples/UserExample'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Me]
      operationId: updateCurrentUser
      security:
        - bearerAuth: [write]
        - cookieAuth: []
      summary: Update my profile (display name)
      description: |
        **Authenticated.** Sets the display name shown to teammates next to ballots and in member lists.
        Defaults to the local part of the email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
            example:
              display_name: Anna K.
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 5b1c3f0e-2a4d-4f7e-9c11-0d2b6c8a9e01
                email: anna@company.com
                display_name: Anna K.
                created_at: '2026-11-02T08:01:12Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/me/teams:
    get:
      tags: [Me]
      operationId: listMyTeams
      security:
        - bearerAuth: [read]
        - cookieAuth: []
      summary: List teams I belong to
      description: '**Authenticated.** All teams the caller is a member of, with the caller''s role in each.'
      responses:
        '200':
          description: My memberships.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MyTeam'
              example:
                items:
                  - role: admin
                    joined_at: '2026-11-02T08:05:00Z'
                    team:
                      id: 7d0f6a52-8a8e-4f43-b0a3-2b5f3e1d9c10
                      name: Design crew
                      timezone: Europe/Berlin
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/me/api-tokens:
    get:
      tags: [API tokens]
      operationId: listApiTokens
      summary: List my personal API tokens
      description: '**Authenticated (session only).** Lists the caller''s tokens. Secret values are never returned again after creation.'
      responses:
        '200':
          description: Tokens (without secrets).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiToken'
              example:
                items:
                  - id: 0c6a3e1f-5b7d-4c2a-8e9f-1a2b3c4d5e6f
                    name: lunch-cli on laptop
                    scopes: [read, write]
                    token_prefix: wswe_pat_3kF9
                    created_at: '2026-11-17T09:20:00Z'
                    expires_at: '2027-11-17T00:00:00Z'
                    last_used_at: '2026-11-17T09:31:44Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [API tokens]
      operationId: createApiToken
      summary: Create a personal API token
      description: |
        **Authenticated.** Creates a long-lived bearer token for a CLI or AI agent. The secret `token` is
        returned **only in this response** - store it securely. The token acts as the caller with the
        caller's team roles, limited to the requested `scopes` (default both `read` and `write`); use
        `scopes: [read]` for agents that should only observe. Requires a session (an API token cannot
        create tokens).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTokenCreate'
            example:
              name: lunch-cli on laptop
              scopes: [read, write]
              expires_at: '2027-11-17T00:00:00Z'
      responses:
        '201':
          description: Token created. `token` is shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenWithSecret'
              example:
                id: 0c6a3e1f-5b7d-4c2a-8e9f-1a2b3c4d5e6f
                name: lunch-cli on laptop
                scopes: [read, write]
                token_prefix: wswe_pat_3kF9
                created_at: '2026-11-17T09:20:00Z'
                expires_at: '2027-11-17T00:00:00Z'
                last_used_at: null
                token: wswe_pat_3kF9q2LwXbR7mZt0aVhY8cNdE1sUoPj4
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/me/api-tokens/{tokenId}:
    parameters:
      - $ref: '#/components/parameters/TokenId'
    delete:
      tags: [API tokens]
      operationId: revokeApiToken
      summary: Revoke a personal API token
      description: '**Authenticated (session only, token owner).** Revokes immediately. Idempotent: revoking an already-revoked token returns `204`.'
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/invites/{inviteToken}:
    parameters:
      - $ref: '#/components/parameters/InviteToken'
    get:
      tags: [Invites]
      operationId: getInviteInfo
      security:
        - bearerAuth: [read]
        - cookieAuth: []
      summary: Preview an invite link
      description: |
        **Authenticated** (any signed-in user; invitees sign in first). Shows which team an invite token
        belongs to and whether the caller is already a member. `404 invite_invalid` if the token is unknown,
        revoked or regenerated.
      responses:
        '200':
          description: Invite preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreview'
              example:
                team_id: 7d0f6a52-8a8e-4f43-b0a3-2b5f3e1d9c10
                team_name: Design crew
                member_count: 6
                already_member: false
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InviteInvalid'

  /v1/invites/{inviteToken}/accept:
    parameters:
      - $ref: '#/components/parameters/InviteToken'
    post:
      tags: [Invites]
      operationId: joinTeam
      security:
        - bearerAuth: [write]
        - cookieAuth: []
      summary: Join a team via invite link
      description: |
        **Authenticated.** Adds the caller to the team as `member`. **Idempotent**: if the caller is already a
        member, returns `200` with the existing membership (role unchanged) and `joined: false`.
      responses:
        '200':
          description: Already a member; nothing changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinResult'
              example:
                joined: false
                role: admin
                team:
                  id: 7d0f6a52-8a8e-4f43-b0a3-2b5f3e1d9c10
                  name: Design crew
                  timezone: Europe/Berlin
        '201':
          description: Joined the team.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinResult'
              example:
                joined: true
                role: member
                team:
                  id: 7d0f6a52-8a8e-4f43-b0a3-2b5f3e1d9c10
                  name: Design crew
                  timezone: Europe/Berlin
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InviteInvalid'

  /v1/teams:
    post:
      tags: [Teams]
      operationId: createTeam
      security:
        - bearerAuth: [write]
        - cookieAuth: []
      summary: Create a team
      description: |
        **Authenticated.** Creates a team with the caller as its first `admin` and generates an invite link.
        Schedule defaults to 08:00-11:30, Monday-Friday, team-local. The team always starts with an
        **empty** restaurant list; add restaurants with `createRestaurant`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreate'
            example:
              name: Design crew
              timezone: Europe/Berlin
              office: Berlin Mitte
      responses:
        '201':
          description: Team created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
              examples:
                team:
                  $ref: '#/components/examples/TeamExample'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Teams]
      operationId: getTeam
      security:
        - bearerAuth: [read]
        - cookieAuth: []
      summary: Get a team and its settings
      description: '**Member.** Team details, schedule and the caller''s role.'
      responses:
        '200':
          description: The team.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
              examples:
                team:
                  $ref: '#/components/examples/TeamExample'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Teams]
      operationId: updateTeam
      security:
        - bearerAuth: [write]
        - cookieAuth: []
      summary: Update team settings (name, timezone, office, schedule)
      description: |
        **Admin.** Partial update; only provided fields change. Timezone and schedule changes
        (`timezone`, `open_time`, `close_time`) apply only to polls that have **not opened yet**; an open or
        closed poll keeps its `opens_at` / `closes_at`. `open_time` must be earlier than `close_time`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpdate'
            example:
              name: Design crew (Mitte)
              close_time: '11:45'
      responses:
        '200':
          description: Updated team.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
              examples:
                team:
                  $ref: '#/components/examples/TeamExample'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/teams/{teamId}/members:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Members]
      operationId: listMembers
      security:
        - bearerAuth: [read]
        - cookieAuth: []
      summary: List team members
      description: '**Member.** All members ordered by `joined_at` ascending.'
      responses:
        '200':
          description: Members.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
              example:
                items:
                  - user_id: 5b1c3f0e-2a4d-4f7e-9c11-0d2b6c8a9e01
                    display_name: anna
                    role: admin
                    joined_at: '2026-11-02T08:05:00Z'
                  - user_id: 9e4d2c1b-3a5f-4e6d-8c7b-6a5f4e3d2c1b
                    display_name: ben
                    role: member
                    joined_at: '2026-11-03T07:58:41Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/teams/{teamId}/members/me:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    delete:
      tags: [Members]
      operationId: leaveTeam
      security:
        - bearerAuth: [write]
        - cookieAuth: []
      summary: Leave a team
      description: |
        **Member.** Removes the caller from the team. Ballots already cast stay in history (and in an open
        poll they remain counted - withdraw first with `deleteMyBallot` if desired).
        The last remaining admin cannot leave while other members exist (`409 last_admin`); promote someone
        first. If the caller is the only member, leaving is allowed and the team becomes inaccessible.
      responses:
        '204':
          description: Left the team.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/LastAdmin'

