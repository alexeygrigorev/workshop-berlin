name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PRs: a new push cancels the older run. main/manual runs queue and are never cancelled, so a deploy in
# progress always finishes.
concurrency:
  group: ci-cd-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    name: backend (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      # Always started (cheap); only used by the matrix entry that sets WSWE_TEST_DATABASE_URL.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wswe
          POSTGRES_PASSWORD: wswe
          POSTGRES_DB: wswe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wswe -d wswe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: pytest
        env:
          WSWE_TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://wswe:wswe@localhost:5432/wswe' || '' }}
        run: uv run pytest -q

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run build:static

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # globalSetup starts (and tears down) its own docker compose project, wswe-e2e.
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: wswe:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [backend-tests, frontend-tests, e2e, docker-build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # Recommended: output of `ssh-keyscan -t ed25519 <host>` taken from a trusted network/console. If empty,
          # deploy.sh falls back to ssh-keyscan at deploy time (trust on first use, no MITM protection).
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH || '/root/workshop-berlin' }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          trap 'rm -f "$key_file"' EXIT
          DEPLOY_SSH_KEY_FILE="$key_file" sh deploy/deploy.sh
      - name: Verify the public health endpoint
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Repository variable DEPLOY_URL (e.g. https://1-2-3-4.sslip.io) is not set"
            exit 1
          fi
          url="${DEPLOY_URL%/}/v1/health"
          for i in $(seq 1 24); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)"
            echo "attempt $i: $url -> HTTP $code"
            [ "$code" = 200 ] && exit 0
            sleep 5
          done
          echo "::error::$url did not return 200 within ~2 minutes"
          exit 1
