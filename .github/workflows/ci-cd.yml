name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PRs: a new push cancels the older run. main/manual runs queue and are never cancelled, so a deploy in
# progress always finishes.
concurrency:
  group: ci-cd-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    name: backend (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      # Always started (cheap); only used by the matrix entry that sets WSWE_TEST_DATABASE_URL.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wswe
          POSTGRES_PASSWORD: wswe
          POSTGRES_DB: wswe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wswe -d wswe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: pytest
        env:
          WSWE_TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://wswe:wswe@localhost:5432/wswe' || '' }}
        run: uv run pytest -q

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run build:static

  # Builds the production image exactly once. e2e tests this image and deploy ships this image; both verify the
  # tarball sha256 and the image ID against this job's outputs before using it.
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.manifest.outputs.image_tag }}
      image_id: ${{ steps.manifest.outputs.image_id }}
      tar_sha256: ${{ steps.manifest.outputs.tar_sha256 }}
    env:
      IMAGE_TAG: wswe:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # VITE_API_URL="" in the Dockerfile: same-origin frontend, no host baked in; runtime config comes from env.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (SQLite, no seed)
        run: |
          docker run -d --name smoke -p 8000:8000 -e WSWE_DATABASE_URL=sqlite:///:memory:             -e WSWE_AUTO_MIGRATE=true -e WSWE_SEED_DEMO_DATA=false "$IMAGE_TAG"
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/v1/health && exit 0
            sleep 2
          done
          docker logs smoke
          echo "::error::smoke test failed"
          exit 1
      - name: Export image and record manifest
        id: manifest
        run: |
          docker rm -f smoke >/dev/null 2>&1 || true
          mkdir out
          docker save "$IMAGE_TAG" | gzip -n > out/wswe-image.tar.gz
          image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")"
          tar_sha256="$(sha256sum out/wswe-image.tar.gz | cut -d' ' -f1)"
          printf '{"image_tag":"%s","image_id":"%s","tar_sha256":"%s","commit":"%s"}
'             "$IMAGE_TAG" "$image_id" "$tar_sha256" "$GITHUB_SHA" > out/image-manifest.json
          cat out/image-manifest.json
          ls -lh out
          {
            echo "image_tag=$IMAGE_TAG"
            echo "image_id=$image_id"
            echo "tar_sha256=$tar_sha256"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: wswe-image
          path: out/
          retention-days: 1
          compression-level: 0  # already gzipped

  e2e:
    needs: [build-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tested_image_id: ${{ steps.tested.outputs.tested_image_id }}
    env:
      WSWE_IMAGE: ${{ needs.build-image.outputs.image_tag }}
      WSWE_IMAGE_ID: ${{ needs.build-image.outputs.image_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wswe-image
          path: image
      - name: Verify and load the image
        env:
          EXPECTED_SHA256: ${{ needs.build-image.outputs.tar_sha256 }}
        run: |
          actual="$(sha256sum image/wswe-image.tar.gz | cut -d' ' -f1)"
          echo "tarball sha256 EXPECTED $EXPECTED_SHA256 ACTUAL $actual"
          [ -n "$EXPECTED_SHA256" ] && [ "$actual" = "$EXPECTED_SHA256" ]             || { echo "::error::image tarball sha256 mismatch"; exit 1; }
          gunzip -c image/wswe-image.tar.gz | docker load
          loaded="$(docker image inspect --format '{{.Id}}' "$WSWE_IMAGE")"
          echo "image ID EXPECTED $WSWE_IMAGE_ID ACTUAL $loaded"
          [ -n "$WSWE_IMAGE_ID" ] && [ "$loaded" = "$WSWE_IMAGE_ID" ]             || { echo "::error::loaded image ID mismatch"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      # globalSetup starts (and tears down) its own docker compose project, wswe-e2e, from the prebuilt image
      # (no build) and asserts the running app container uses image ID $WSWE_IMAGE_ID.
      - run: npx playwright test
        working-directory: e2e
      - name: Record the tested image ID
        id: tested
        run: echo "tested_image_id=$(docker image inspect --format '{{.Id}}' "$WSWE_IMAGE")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    needs: [backend-tests, frontend-tests, build-image, e2e]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wswe-image
          path: image
      - name: Check that the image to deploy is the one that was tested
        env:
          BUILT_ID: ${{ needs.build-image.outputs.image_id }}
          TESTED_ID: ${{ needs.e2e.outputs.tested_image_id }}
          EXPECTED_SHA256: ${{ needs.build-image.outputs.tar_sha256 }}
        run: |
          echo "built  image ID: $BUILT_ID"
          echo "tested image ID: $TESTED_ID"
          [ -n "$BUILT_ID" ] && [ "$BUILT_ID" = "$TESTED_ID" ]             || { echo "::error::image deployed differs from the image e2e tested"; exit 1; }
          actual="$(sha256sum image/wswe-image.tar.gz | cut -d' ' -f1)"
          echo "tarball sha256 EXPECTED $EXPECTED_SHA256 ACTUAL $actual"
          [ -n "$EXPECTED_SHA256" ] && [ "$actual" = "$EXPECTED_SHA256" ]             || { echo "::error::image tarball sha256 mismatch"; exit 1; }
      - name: Deploy over SSH
        env:
          WSWE_IMAGE: ${{ needs.build-image.outputs.image_tag }}
          WSWE_IMAGE_ID: ${{ needs.build-image.outputs.image_id }}
          WSWE_IMAGE_SHA256: ${{ needs.build-image.outputs.tar_sha256 }}
          WSWE_IMAGE_TAR: image/wswe-image.tar.gz
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # Recommended: output of `ssh-keyscan -t ed25519 <host>` taken from a trusted network/console. If empty,
          # deploy.sh falls back to ssh-keyscan at deploy time (trust on first use, no MITM protection).
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH || '/root/workshop-berlin' }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          trap 'rm -f "$key_file"' EXIT
          DEPLOY_SSH_KEY_FILE="$key_file" sh deploy/deploy.sh
      - name: Verify the public health endpoint
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Repository variable DEPLOY_URL (e.g. https://1-2-3-4.sslip.io) is not set"
            exit 1
          fi
          url="${DEPLOY_URL%/}/v1/health"
          for i in $(seq 1 24); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)"
            echo "attempt $i: $url -> HTTP $code"
            [ "$code" = 200 ] && exit 0
            sleep 5
          done
          echo "::error::$url did not return 200 within ~2 minutes"
          exit 1
