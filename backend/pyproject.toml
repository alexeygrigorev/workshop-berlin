[project]
name = "wswe-backend"
version = "1.0.0"
description = "Where Should We Eat? - FastAPI backend (in-memory store)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "argon2-cffi==25.1.0",
    "tzdata==2026.6",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "openapi-core==0.23.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
