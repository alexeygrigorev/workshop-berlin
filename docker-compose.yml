# Local services. `docker compose up -d --build` runs Postgres and the full app image on :8000;
# Host ports and the data volume can be overridden (WSWE_DB_PORT, WSWE_APP_PORT, WSWE_PGDATA_VOLUME); the e2e suite does.
# `docker compose up -d db` starts only Postgres (for `make backend-pg`).
name: wswe

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wswe
      POSTGRES_PASSWORD: wswe
      POSTGRES_DB: wswe
    ports:
      - "${WSWE_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wswe -d wswe"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    # WSWE_IMAGE: use a prebuilt image (e.g. loaded from the CI artifact) instead of building; never pulled.
    image: ${WSWE_IMAGE:-wswe}
    pull_policy: never
    depends_on:
      db:
        condition: service_healthy
    environment:
      WSWE_DATABASE_URL: postgresql+psycopg://wswe:wswe@db:5432/wswe
      WSWE_AUTO_MIGRATE: "true"
    ports:
      - "${WSWE_APP_PORT:-8000}:8000"

volumes:
  pgdata:
    name: ${WSWE_PGDATA_VOLUME:-wswe_pgdata}  # default: same volume the old `docker run` used, so existing data is kept; e2e overrides it
