# Local services. `docker compose up -d --build` runs Postgres and the full app image on :8000;
# `docker compose up -d db` starts only Postgres (for `make backend-pg`).
name: wswe

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wswe
      POSTGRES_PASSWORD: wswe
      POSTGRES_DB: wswe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wswe -d wswe"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: wswe
    depends_on:
      db:
        condition: service_healthy
    environment:
      WSWE_DATABASE_URL: postgresql+psycopg://wswe:wswe@db:5432/wswe
      WSWE_AUTO_MIGRATE: "true"
    ports:
      - "8000:8000"

volumes:
  pgdata:
    name: wswe_pgdata  # same volume the old `docker run` used, so existing data is kept
