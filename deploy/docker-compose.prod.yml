# Single-VPS deployment: Caddy (automatic HTTPS) -> app -> Postgres. Only Caddy publishes ports.
# Usage (from the repo root):
#   WSWE_IMAGE=wswe:<sha> docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --no-build --wait
# Rollouts: deploy/rollout.sh starts the new `app` container next to the old one, waits until it is healthy and then
# stops the old one (zero downtime). That is why `app` has no container_name and publishes no host port; Caddy finds
# every app container through the compose DNS name `app`. See deploy/README.md, "Zero-downtime rollouts".
# CI/CD loads a prebuilt image (wswe:<git sha>) on the server and starts it with --no-build. Without WSWE_IMAGE,
# `up -d --build` builds wswe:prod on the server (manual fallback).
name: wswe-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wswe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: wswe
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wswe -d wswe"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: ${WSWE_IMAGE:-wswe:prod}
    pull_policy: never  # never pull wswe:<sha> from Docker Hub; it is loaded over SSH (or built with --build)
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s  # old container drains in-flight requests; uvicorn cuts SSE streams after 10 s
    # Faster than the image default (30 s) so a new container reports healthy (and a bad one unhealthy) quickly.
    healthcheck:
      interval: 3s
      timeout: 4s
      start_period: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    environment:
      WSWE_DATABASE_URL: postgresql+psycopg://wswe:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@db:5432/wswe
      WSWE_AUTO_MIGRATE: "true"
      WSWE_SEED_DEMO_DATA: ${WSWE_SEED_DEMO_DATA:-false}
      WSWE_APP_ORIGIN: https://${DOMAIN:?set DOMAIN in deploy/.env}
      WSWE_CORS_ORIGINS: https://${DOMAIN}
      WSWE_COOKIE_SECURE: "true"
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
